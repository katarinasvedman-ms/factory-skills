name: Publish Foundry skills
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: foundry-publish
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: foundry-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -c requirements.lock ".[foundry]"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read previous promoted release and configured role identities
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE_IDENTITIES: ${{ vars.FOUNDRY_ROLE_IDENTITIES }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish a superseded main commit."
            exit 1
          fi
          mkdir -p dist
          python -c 'import json, os; from pathlib import Path; Path("dist/role-identities.json").write_text(json.dumps(json.loads(os.environ["ROLE_IDENTITIES"])))'
          tag=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r '[.[][] | select((.tag_name | startswith("foundry-")) and (.draft | not) and (.prerelease | not))] | sort_by(.published_at) | last | .tag_name // ""')
          if [[ -n "$tag" ]]; then
            gh release download "$tag" --pattern role-bindings.json --dir dist/previous
          fi
      - name: Publish changed skills and verify pinned role toolboxes
        env:
          PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_TOKEN_CREDENTIALS: AzureCliCredential
        run: |
          baseline=()
          if [[ -f dist/previous/role-bindings.json ]]; then
            baseline=(--baseline dist/previous/role-bindings.json)
          fi
          python -m tools.publish_foundry \
            --endpoint "$PROJECT_ENDPOINT" \
            --role-identities dist/role-identities.json \
            --source-commit "$GITHUB_SHA" \
            "${baseline[@]}" \
            --output dist/role-bindings.json --publish
      - name: Promote verified bindings as a versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="foundry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -c 'import json; from pathlib import Path; b=json.loads(Path("dist/role-bindings.json").read_text()); print("Source: "+b["release"]["source_commit"]); print("Uploaded skills: "+", ".join(b["release"]["uploaded_skills"])); print("Changed toolboxes: "+", ".join(b["release"]["changed_toolboxes"])); print("Verified: "+b["release"]["verification"])' > dist/notes.txt
          gh release create "$tag" dist/role-bindings.json \
            --target "$GITHUB_SHA" --title "Foundry skills $GITHUB_RUN_NUMBER" \
            --notes-file dist/notes.txt --draft --latest=false
          gh release edit "$tag" --draft=false --latest=false
          {
            echo "## Verified Foundry release"
            cat dist/notes.txt
            echo
            echo "Binding: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo
            echo 'Download for a new factory execution (PowerShell):'
            echo '```powershell'
            echo "gh release download $tag --repo $GITHUB_REPOSITORY --pattern role-bindings.json --dir .artifacts\\$tag"
            echo '```'
            echo 'Use that file with ai-factory prepare --source foundry --skill-mode provider --foundry-binding <file>.'
            echo 'Existing executions and Foundry service defaults are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-publication
          path: dist/
