name: Validate skills
on:
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      version_baseline:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -c requirements.lock . --group dev
      - run: python -m tools.skills validate
      - name: Require versions for changed skills
        if: inputs.source_ref == '' || inputs.version_baseline != ''
        env:
          BASE_SHA: ${{ inputs.version_baseline || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            python -m tools.skills validate --baseline "$BASE_SHA"
          fi
      - run: python -m pytest -q
      - run: python -m ruff check tools tests
      - run: python -m ruff format --check tools tests
      - run: python -m tools.skills build --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: factory-skills
          path: |
            dist/release.zip
            dist/release/release.json
